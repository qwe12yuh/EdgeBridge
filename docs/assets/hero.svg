<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">EdgeBridge — macOS 与 Windows 原生跨屏文件拖放</title>
  <desc id="desc">Two computers. One continuous drag. Native file drag-and-drop between macOS AppKit and Windows OLE across a shared pointer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07101e"/>
      <stop offset="55%" stop-color="#0c1b31"/>
      <stop offset="100%" stop-color="#081322"/>
    </linearGradient>
    <radialGradient id="seamGlow" cx="0.73" cy="0.48" r="0.38">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#081322" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="seamLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.1"/>
      <stop offset="20%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10223b"/>
      <stop offset="100%" stop-color="#0b1729"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e3352" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="440" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="440" rx="20" fill="url(#seamGlow)"/>
  <rect x="1" y="1" width="1278" height="438" rx="19" fill="none" stroke="#1e3454" stroke-width="1.5"/>

  <!-- Left Column: Brand & Positioning -->
  <g transform="translate(60, 52)">
    <!-- Status & License Pills -->
    <rect x="0" y="0" width="142" height="28" rx="14" fill="#0d2e32" stroke="#1f635c" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#2dd4bf"/>
    <text x="28" y="18" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="0.5">MIT CORE REPO</text>

    <rect x="154" y="0" width="212" height="28" rx="14" fill="#231c10" stroke="#6b4c1b" stroke-width="1"/>
    <circle cx="170" cy="14" r="4" fill="#f59e0b"/>
    <text x="182" y="18" fill="#fcd34d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.4">DEV PREVIEW · v0.1.0-alpha.1</text>

    <!-- Brand Mark + Wordmark -->
    <g transform="translate(0, 54)">
      <rect x="0" y="6" width="48" height="48" rx="12" fill="#0f293a" stroke="url(#accent)" stroke-width="2"/>
      <rect x="9" y="16" width="13" height="28" rx="3" fill="none" stroke="#5eead4" stroke-width="1.8"/>
      <rect x="26" y="16" width="13" height="28" rx="3" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
      <path d="M18 30 H31" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M28 26 L32 30 L28 34" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="47" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="60" font-weight="800" letter-spacing="-2">EdgeBridge</text>
    </g>

    <!-- Headlines -->
    <text x="2" y="158" fill="#e2e8f0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600">让文件跟随鼠标，在 macOS 与 Windows 之间完成原生跨屏拖放</text>
    <text x="2" y="188" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15">Two computers. One continuous drag. Native AppKit &amp; Win32 OLE handoff.</text>

    <!-- Technical Pillars -->
    <g transform="translate(0, 222)">
      <rect x="0" y="0" width="172" height="64" rx="10" fill="#0d1d33" stroke="#1e3658" stroke-width="1"/>
      <text x="14" y="25" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">AppKit + Win32 OLE</text>
      <text x="14" y="46" fill="#cbd5e1" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5">系统级原生拖放会话接续</text>

      <rect x="184" y="0" width="182" height="64" rx="10" fill="#0d1d33" stroke="#1e3658" stroke-width="1"/>
      <text x="198" y="25" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">Pinned TLS + SHA-256</text>
      <text x="198" y="46" fill="#cbd5e1" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5">完整暂存校验后交接 (≤64MiB)</text>

      <rect x="378" y="0" width="182" height="64" rx="10" fill="#0d1d33" stroke="#1e3658" stroke-width="1"/>
      <text x="392" y="25" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">Physical Generation</text>
      <text x="392" y="46" fill="#cbd5e1" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5">一次性许可与真实松手验证</text>
    </g>

    <!-- Bottom Metadata Strip -->
    <text x="2" y="324" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Node.js &gt;= 22 (Zero npm deps)  ·  Swift AppKit  ·  C# STA OLE  ·  External GPL-2.0 Deskflow Adapter</text>
  </g>

  <!-- Right Column: Cross-Screen Handoff Schematic -->
  <g transform="translate(656, 48)">
    <!-- Left Screen: macOS -->
    <rect x="0" y="24" width="248" height="252" rx="14" fill="url(#cardBg)" stroke="#27436b" stroke-width="1.5"/>
    <path d="M0 38 a14 14 0 0 1 14 -14 h220 a14 14 0 0 1 14 14 v22 h-248 z" fill="#132946"/>
    <circle cx="18" cy="42" r="4.5" fill="#475569"/>
    <circle cx="32" cy="42" r="4.5" fill="#475569"/>
    <circle cx="46" cy="42" r="4.5" fill="#475569"/>
    <text x="64" y="46" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">macOS · AppKit</text>

    <!-- Source File Card on macOS -->
    <rect x="22" y="82" width="150" height="92" rx="8" fill="#091526" stroke="#1e3a5f" stroke-dasharray="4 3"/>
    <text x="34" y="104" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Finder / Desktop</text>
    <text x="34" y="156" fill="#475569" font-family="system-ui, sans-serif" font-size="11">源文件始终保留</text>

    <!-- Dragging File Card Crossing Seam -->
    <g transform="translate(132, 98)">
      <rect x="0" y="0" width="104" height="58" rx="8" fill="#11333b" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="12" y="23" fill="#ecfeff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">slides.pptx</text>
      <text x="12" y="42" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">SHA-256 OK</text>
    </g>

    <!-- macOS Footer Tag -->
    <rect x="16" y="232" width="216" height="28" rx="6" fill="#091526" stroke="#1b3252"/>
    <text x="124" y="250" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">NSDraggingSession · Scoped Permit</text>

    <!-- Right Screen: Windows -->
    <rect x="316" y="24" width="248" height="252" rx="14" fill="url(#cardBg)" stroke="#27436b" stroke-width="1.5"/>
    <path d="M316 38 a14 14 0 0 1 14 -14 h220 a14 14 0 0 1 14 14 v22 h-248 z" fill="#132946"/>
    <text x="334" y="46" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">Windows · Win32 OLE</text>
    <line x1="510" y1="42" x2="520" y2="42" stroke="#64748b" stroke-width="1.5"/>
    <rect x="528" y="37" width="9" height="9" fill="none" stroke="#64748b" stroke-width="1.3"/>

    <!-- Drop Target Zone on Windows -->
    <rect x="378" y="82" width="166" height="126" rx="10" fill="#0c2238" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="461" y="106" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Explorer Drop Target</text>

    <!-- Landed / Active Drag Card on Target -->
    <g transform="translate(398, 120)">
      <rect x="0" y="0" width="126" height="62" rx="8" fill="#132e4a" stroke="#38bdf8" stroke-width="1.8"/>
      <text x="14" y="24" fill="#f0f9ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">slides.pptx</text>
      <text x="14" y="44" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11">松手触发原生复制</text>
      <!-- Pointer Icon -->
      <path d="M108 38 L124 46 L116 49 L119 57 L114 59 L111 51 L106 55 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    </g>

    <!-- Windows Footer Tag -->
    <rect x="332" y="232" width="216" height="28" rx="6" fill="#091526" stroke="#1b3252"/>
    <text x="440" y="250" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">DoDragDrop · IDropSource</text>

    <!-- Center Screen Edge Boundary Seam -->
    <line x1="282" y1="12" x2="282" y2="288" stroke="url(#seamLine)" stroke-width="3"/>
    <rect x="234" y="0" width="96" height="22" rx="11" fill="#0d2e32" stroke="#2dd4bf" stroke-width="1"/>
    <text x="282" y="15" text-anchor="middle" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">SCREEN EDGE</text>

    <!-- Continuous Gesture Trajectory Across Seam -->
    <path d="M 236 127 C 272 127, 344 148, 396 148" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="396,148 386,143 386,153" fill="#38bdf8"/>

    <!-- Staged TLS Channel Arc -->
    <path d="M 200 174 C 255 208, 315 208, 376 174" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="228" y="186" width="108" height="20" rx="5" fill="#0a1628" stroke="#294366"/>
    <text x="282" y="200" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">TLS Stage &amp; Verify</text>

    <!-- Bottom Telemetry Summary Bar -->
    <rect x="0" y="294" width="564" height="44" rx="10" fill="#0a1628" stroke="#1e3454" stroke-width="1"/>
    <circle cx="20" cy="316" r="4" fill="#2dd4bf"/>
    <text x="34" y="320" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
      实机验证: PPTX 双向拖放通过 · Win→Mac 松手至结束 ~33ms (单次实测) · 53 项 Node 测试
    </text>
  </g>
</svg>
